<div class="two-column-layout">
  <div class="left inner-box">
    <div class="code-window">
      <div class="editor-header-row">
        <h4 class="text-center">Editor</h4>
        <button class="btn btn-success btn-sm" disabled type="button" id="runButton">Loading webR...</button>
      </div>
      <div class="padding">
        <div id="editor">ggplot()</div>
        <pre><code id="out"></code></pre>
      </div>
    </div>
  </div>

  <div class="right mx-auto text-center inner-box">
    <div class="mx-auto text-center">
      <div style="display: flex; align-items: center; justify-content: center; position: relative;">
        <h4 class="subheader-pill" style="flex: 1; text-align: center;">Plot Output</h4>
        <label style="position: absolute; right: 5%; text-align: center;
        padding-bottom: 2rem;">
          <input type="checkbox" id="show-diff"> Diff View
        </label>
      </div>
    </div>
    <div class="compare-container mx-auto text-center padding" id="sliderContainer">
      <canvas id="canvas-base" width="700" height="400" style="display: none;"></canvas>
      <canvas id="canvas" width="700" height="400"></canvas>
      <div class="slider" id="slider" style="left: 300px;"></div>
    </div>

    <div class="compare-result">
      <span class="text-muted" style="color: #adb5bd; font-size: 1.75rem;">Similarity:</span>
      <span id="similarity-score" style="color: #0dcaf0; font-weight: 600; font-size: 1.75rem;">N/A</span>
    </div>
  </div>

</div>

<div class="leaderboard-wrapper">
  <div class="inner-box leaderboard-box">
    <div class="leaderboard-header-row">
      <h4>Leaderboard</h4>
      <button class="btn btn-outline-light btn-sm" type="button" id="leaderboard-refresh">Refresh</button>
    </div>

    <form id="leaderboard-form" class="leaderboard-form">
      <label for="leaderboard-name" class="visually-hidden">Display name</label>
      <input class="form-control form-control-sm" id="leaderboard-name" name="displayName" maxlength="32"
        autocomplete="nickname" placeholder="Display name">
      <button class="btn btn-info btn-sm" disabled type="submit" id="leaderboard-submit">Submit score</button>
    </form>

    <div id="leaderboard-status" class="leaderboard-status" role="status" aria-live="polite"></div>

    <div class="leaderboard-table-wrapper">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Name</th>
            <th scope="col">Score</th>
            <th scope="col">Date</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr>
            <td colspan="4">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
